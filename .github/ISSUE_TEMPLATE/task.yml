name: 📌 新任务 / New Task
description: 新增一个项目任务到时间线
title: "任务名称"
body:
  - type: input
    id: project
    attributes:
      label: 项目
      description: 属于哪个项目（同名会分在一组）
      placeholder: 例如 3CC Event / AI Kan
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: 开始日期
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: 截止日期
      placeholder: "2026-11-30"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 状态
      options:
        - 未开始
        - 进行中
        - 卡住
        - 已完成
    validations:
      required: true
  - type: dropdown
    id: progress
    attributes:
      label: 进度
      options:
        - "0%"
        - "10%"
        - "25%"
        - "50%"
        - "75%"
        - "90%"
        - "100%"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注
      placeholder: 细节、链接、需要谁帮忙…
